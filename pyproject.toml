[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-cost-compass"
version = "1.0.0"
description = "Compare, estimate, and optimize AI API costs across providers. Real-time pricing for OpenAI, Anthropic, Google, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "AI Cost Compass Contributors" }]
keywords = ["ai", "llm", "cost", "pricing", "openai", "anthropic", "google", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]

[project.scripts]
aicc = "ai_cost_compass.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/ai-cost-compass"
Repository = "https://github.com/YOUR_USERNAME/ai-cost-compass"
Issues = "https://github.com/YOUR_USERNAME/ai-cost-compass/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
